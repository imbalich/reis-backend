# ============================================================================
# 风电版部署编排 docker-compose-wind.yml
# 与铁路版(docker-compose-reis.yml)并存部署, 端口/网络/卷全部隔离
# 风电版端口: 前端 8080 (防火墙已放行), 后端 8002 (已放行)
# 数据库: 172.30.1.148:3306 的 fba_wind 库 (视图已建好, 见 backend/sql/mysql/wind_view_init.sql)
# Redis: 172.30.1.148:6379 (宿主机 Redis, 与铁路版共用)
# ============================================================================
services:
  fba_server_wind:
    build:
      context: .
      dockerfile: Dockerfile
    image: fba_server_wind:latest
    container_name: fba_server_wind
    restart: always
    depends_on:
      - fba_celery_wind
    volumes:
      - ./deploy/backend/docker-compose/.env.server.wind:/fba/backend/.env
      - fba_wind_static:/fba/backend/app/static
      - fba_wind_static_upload:/fba/backend/static/upload
    networks:
      - fba_wind_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s 172.30.1.148:3306 -t 60
        wait-for-it -s 172.30.1.148:6379 -t 60
        supervisord -c /etc/supervisor/supervisord.conf
    ports:
      - "8002:8001"

  fba_rabbitmq_wind:
    hostname: fba_rabbitmq_wind
    image: rabbitmq:3.13.7
    ports:
      - "15673:15672"
      - "5673:5672"
    container_name: fba_rabbitmq_wind
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - fba_wind_rabbitmq:/var/lib/rabbitmq
    networks:
      - fba_wind_network

  fba_celery_wind:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=celery
    image: fba_celery_wind:latest
    ports:
      - "8556:8555"
    container_name: fba_celery_wind
    restart: always
    depends_on:
      - fba_rabbitmq_wind
    volumes:
      - ./deploy/backend/docker-compose/.env.server.wind:/fba/backend/.env
    networks:
      - fba_wind_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq_wind:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_ui_wind:
    build:
      context: "../reis-frontend"    # 部署时前后端两个仓库放在同一父目录
      dockerfile: Dockerfile
    image: fba_ui_wind:latest
    ports:
      - "8080:80"
    container_name: fba_ui_wind
    restart: always
    depends_on:
      - fba_server_wind
    command:
      - nginx
      - -g
      - daemon off;
    volumes:
      - fba_wind_static:/var/www/fba_server/backend/static
    networks:
      - fba_wind_network

networks:
  fba_wind_network:
    name: fba_wind_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.11.0/24     # 铁路版占用 172.10.10.0/24, 风电版错开

volumes:
  fba_wind_static:
    name: fba_wind_static
  fba_wind_static_upload:
    name: fba_wind_static_upload
  fba_wind_rabbitmq:
    name: fba_wind_rabbitmq
